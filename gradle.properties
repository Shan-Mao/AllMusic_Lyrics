org.gradle.jvmargs=-Xmx2G --enable-native-access=ALL-UNNAMED
org.gradle.parallel=true

# Gradle 运行 JVM —— 必须为 JDK 25 及以上：
#   Minecraft 26.2 要求 Java 25，Loom 1.18 已改用 Java 25 的 FFM API。
# 如本机 JDK 路径不同，请修改或删除此行（转而设置 JAVA_HOME）。
org.gradle.java.home=C:\\Program Files\\Java\\jdk-26

# Minecraft —— 目标版本（26.x 起官方不再混淆，无需 mappings）
minecraft_version=26.2
loader_version=0.19.3

mod_version=1.5.0
maven_group=com.coloryr.allmusic
archives_base_name=AllMusic_Lyrics

fabric_version=0.161.0+26.2
